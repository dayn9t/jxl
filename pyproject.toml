[project]
name = "jxl"
version = "0.4.9"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dayn9t", email = "dayn9t@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "jcx @ file:///home/jiang/py/jcx",
    "jvi @ file:///home/jiang/py/jvi",
    "rustshed",
    "pydantic",
    "typer",
    "loguru",
    "ultralytics>=8.4.65",
    "lap", # for ultralytics
    "numpy", # for ultralytics
    "onnxruntime",
    "onnx",
    "opencv_python",
    "clip @ git+https://github.com/ultralytics/CLIP.git", # Ultralytics CLIP 依赖
    "torch",
    "torchvision",
    "openai",
    "volcengine-python-sdk",
    "insightface>=1.0.1",
    "faiss-cpu>=1.14.3",
    "scikit-learn>=1.9.0",
    "nvidia-cusparselt-cu12>=0.7.1",
    # rmb 合成数据管线工具(bin/augment, bin/synth_*, bin/rmb_*)依赖 — ML 数据准备栈,
    # 非 9 个锁定胶水库; ultralytics 训练链路会拉入大部分, 此处显式声明版本约束
    "httpx>=0.27",
    "albumentations>=1.4,<2.0",  # 2.x 改 API(GaussNoise var_limit / BboxParams), 锁 1.x
    "imageio[ffmpeg]>=2.34",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "nuitka",
    "pytest",
]

[project.scripts]
jxl_label = "jxl.bin.jxl_label:main"
jxl_prop = "jxl.bin.jxl_prop:main"
jxl_sample = "jxl.bin.jxl_sample:app"
d2d_label = "jxl.bin.d2d_label:main"
sam_label = "jxl.bin.sam_label:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
# 失效测试隔离: 这些测试模块引用已物理删除的依赖 (pandas / autogluon / torchsummary /
# ias / jcx.m / jxl.det.idetector / jxl.det.yolo_old / 第三方 utils), 无法 import, 属
# pre-existing 死代码, 待 PR-2 死代码清理统一删除/归档。此处从 collection 排除以建立
# 绿色 pytest 基线, 非静默降级 (依赖已不存在, 无替代路径)。
addopts = [
    "--ignore=src/jxl/auto/test/pd_test.py",
    "--ignore=src/jxl/cls/test/classifier_tab_test.py",
    "--ignore=src/jxl/cls/test/classifier_tch_test.py",
    "--ignore=src/jxl/seg/cd/test/open_cd_test.py",
    "--ignore=tests/label/darknet/darknet_test.py",
    "--ignore=tests/det/yolo/d2d_yolo_test.py",
    "--ignore=tests/det/yolo/test_iou.py",
    "--ignore=tests/label/blend_test.py",
    "--ignore=tests/label/extractor_test.py",
    "--ignore=tests/label/extractor2_test.py",
]
