[project]
name = "jxl"
version = "0.4.9"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dayn9t", email = "dayn9t@gmail.com" }
]
requires-python = "~=3.12.0"
dependencies = [
    "jcx @ file:///home/jiang/cc/py/jcx",
    "jvi @ file:///home/jiang/cc/py/jvi",
    "rustshed",
    "pydantic",
    "typer",
    "loguru",
    "orjson",
    "ultralytics>=8.4.65",
    "lap", # for ultralytics
    "numpy", # for ultralytics
    "onnxruntime-gpu<1.28",  # 1.28+ 在 PyPI 仅 win_amd64 wheel; Linux 走 1.27.x (ml 工作基线, B7 gate 通过)
    "onnx",
    "jsonschema", # ModelContract 校验（schema 来自 ml-types Rust 派生）
    "opencv_python",
    "clip @ git+https://github.com/ultralytics/CLIP.git", # Ultralytics CLIP 依赖
    "torch",
    "torchvision",
    "openai",
    "volcengine-python-sdk",
    "insightface>=1.0.1",
    "faiss-cpu>=1.14.3",
    "scikit-learn>=1.9.0",
    "nvidia-cusparselt-cu12>=0.7.1",
    "pandas>=3.0.3",
    # rmb 合成数据管线工具(bin/augment, bin/synth_*, bin/rmb_*)依赖 — ML 数据准备栈,
    # 非 9 个锁定胶水库; ultralytics 训练链路会拉入大部分, 此处显式声明版本约束
    "httpx>=0.27",
    "albumentations>=1.4,<2.0",  # 2.x 改 API(GaussNoise var_limit / BboxParams), 锁 1.x
    "imageio[ffmpeg]>=2.34",
    "pillow>=10.0",
    "transformers",    # Grounding DINO (det_mine validator)
    "rfdetr",          # RF-DETR (det_mine validator)
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "nuitka",
    "pytest",
]

[project.scripts]
jxl_label = "jxl.bin.jxl_label:main"
jxl_prop = "jxl.bin.jxl_prop:main"
jxl_sample = "jxl.bin.jxl_sample:app"
d2d_label = "jxl.bin.d2d_label:main"
sam_label = "jxl.bin.sam_label:app"
peoplenet_check = "jxl.bin.d2d_peoplenet_check:app"
jxl_export_yolo_with_contract = "jxl.bin.export_yolo_with_contract:app"
vdt = "jxl.vdt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
# 失效测试隔离: classifier_tch_test 引用未安装的 torchsummary (NON-LOCKED-LIB, NO-STUB),
# 无法 import。非静默降级 (依赖未安装, 无替代路径)。
addopts = [
    "--ignore=src/jxl/cls/test/classifier_tch_test.py",
]

# [tool.mypy] — 渐进式 strict 基线。
# strict=true 是目标，但启用后全量暴露 >500 错误（多为 jcx/jvi 路径依赖与第三方 ML 库
# 无 stub）。先用高价值告警建立基线，后续逐步收紧到 strict=true。
# 根因修复：python_executable 让 mypy 解析项目 .venv site-packages（jcx/jvi/pydantic 均
# py.typed，否则全部报 import-not-found）；pydantic.mypy 插件让 Rect 等 BaseModel 支持
# 位置参数（否则误报 "Too many positional arguments"）。
[tool.mypy]
python_version = "3.12"
python_executable = ".venv/bin/python"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

# bin/ 下为 ~50 个 argparse CLI 脚本，本轮（T6b）显式跳过 argparse→typer 迁移
# （CLI 回归风险高，标后续 PR）。整体重写时这些脚本的类型错误会随之修复，逐行
# type:ignore 既冗余又会随重写失效，故配置层排除并在此记录，不禁用 strict 回退。
# TODO(dayn9t): bin/ argparse→typer 重写后纳入 mypy 检查。
#   注: 新增的 typer 脚本 (如 d2d_peoplenet_check.py) 已写完整类型注解,
#   但仍被此 blanket exclude 拦截; 待 bin/ 整体迁移完成后按脚本粒度纳入。
exclude = ["src/jxl/bin/"]

# 第三方 ML/工具库无 py.typed stub，按模块豁免（精确到模块，不禁全局 missing-imports）。
[[tool.mypy.overrides]]
module = [
    "cv2",
    "onnxruntime",
    "onnx",
    "jsonschema",
    "pandas",
    "sklearn.*",
    "sklearn",
    "torch.*",
    "torchvision.*",
    "ultralytics.*",
    "lap",
    "faiss",
    "insightface.*",
    "mmcv.*",
    "mmengine.*",
    "mmseg.*",
    "mmdet.*",
    "pycocotools.*",
    "dateutil.*",
    "nuitka.*",
    "joblib",
    "parse",
    "pandas.testing",
    "fire",
    "torchsummary",
    # volcenginesdkarkruntime：火山方舟 Ark runtime SDK，已安装但无 py.typed stub（str2vec_demo 引用）。
    "volcenginesdkarkruntime",
    # 以下为未安装/可选第三方库（异常检测、AutoML、标注转换、变化检测）：
    "pyod.*",
    "autogluon.*",
    "labelme2coco",
    "opencd",
    # ias：dayn9t 架构外的历史采集系统包，仅遗留测试（tests/label/darknet）引用。
    "ias.*",
    # jxl.det.idetector / jxl.det.detector / jxl.det.y5.io / jxl.coco.coco：
    # 迁移中已删除/改名的内部模块，引用它们的 demo/test 函数已废弃，待整体清理。
    "jxl.det.idetector",
    "jxl.det.detector",
    "jxl.det.y5.*",
    "jxl.coco.coco",
]
ignore_missing_imports = true
