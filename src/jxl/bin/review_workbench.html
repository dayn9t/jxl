<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>裁决工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Noto Sans CJK SC", sans-serif; background: #f4f5f7; color: #222; display: flex; min-height: 100vh; }
  aside { width: 240px; flex: 0 0 240px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
          background: #fff; border-right: 1px solid #ddd; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  aside.right { border-right: none; border-left: 1px solid #ddd; width: 220px; flex: 0 0 220px; }
  aside h1 { font-size: 16px; font-weight: 600; }
  .paneltitle { font-size: 12px; font-weight: 600; color: #888; letter-spacing: .05em; margin: 4px 0 -2px; }
  .tabs { display: flex; flex-direction: column; gap: 6px; }
  .tabs button { padding: 8px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer;
                 font-size: 13px; text-align: left; line-height: 1.4; }
  .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .viewtoggle { padding: 8px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .progress { font-size: 13px; color: #555; }
  .bar { width: 100%; height: 8px; background: #e2e4e9; border-radius: 4px; overflow: hidden; display: block; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: #22c55e; }
  .sizerow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; }
  .sizerow input[type=range] { flex: 1; }
  .hint { font-size: 11.5px; color: #888; line-height: 1.7; margin-top: auto; border-top: 1px solid #eee; padding-top: 10px; }
  @media (max-width: 1100px) { aside.right { display: none; } }
  main { flex: 1; min-width: 0; margin: 14px auto; padding: 0 16px; max-width: 1200px; }
  .taskinfo { background: #eef4ff; border: 1px solid #c7d7f5; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .taskinfo summary { cursor: pointer; font-weight: 600; color: #1d4ed8; font-size: 13px; }
  .taskinfo .intro { white-space: pre-wrap; line-height: 1.8; color: #333; margin-top: 8px; }
  .taskinfo .intro b { color: #1d4ed8; }
  .taskinfo ul { margin: 8px 0 0 0; padding-left: 20px; line-height: 1.8; color: #444; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
  .imgs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .imgs figure { text-align: center; }
  .imgs img { max-width: 46%; max-height: 420px; border: 1px solid #ccc; border-radius: 6px; }
  .imgs figcaption { font-size: 12px; color: #777; margin-top: 4px; }
  /* 大图模式：左右并排，每张宽度 --imgw（右栏滑杆可调，默认 300px），中缝约 100px */
  .imgs.big { display: flex; justify-content: center; align-items: flex-start; column-gap: clamp(60px, 7vw, 110px); row-gap: 12px; flex-wrap: wrap; }
  .imgs.big figure { flex: 0 0 min(var(--imgw, 300px), 30vw); }
  .imgs.big img { width: 100%; max-width: 100%; max-height: none; height: auto; }
  .meta { font-size: 13px; color: #555; line-height: 1.7; background: #f8f9fb; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; white-space: pre-wrap; }
  .meta .ok { color: #16a34a; font-weight: 800; font-size: 16px; }
  .meta .bad { color: #dc2626; font-weight: 800; font-size: 16px; }
  .meta .q { color: #d97706; font-weight: 800; font-size: 16px; }
  .dock { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e2e4e9; padding: 10px 0 4px; border-radius: 0 0 10px 10px; }
  .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .opts button { padding: 8px 14px; font-size: 14px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; }
  .opts button .k { display: block; }
  .opts button .k b { color: #2563eb; margin-right: 6px; }
  .opts button .d { display: block; font-size: 11.5px; color: #777; margin-top: 3px; max-width: 300px; line-height: 1.45; }
  .opts button:hover { border-color: #2563eb; }
  .opts button.picked { background: #16a34a; color: #fff; border-color: #16a34a; }
  .opts button.picked .k b, .opts button.picked .d { color: #eaffea; }
  .nav { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .nav button { padding: 8px 14px; font-size: 14px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; }
  .nav .pos { font-size: 14px; font-weight: 600; color: #1d4ed8; white-space: nowrap; }
  .nav .note { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; min-width: 120px; }
  .done { text-align: center; padding: 60px 0; color: #16a34a; font-size: 18px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<aside class="left">
  <h1>裁决工作台</h1>
  <div class="tabs" id="tabs"></div>
  <div class="progress"><span id="ptext"></span><span class="bar"><i id="pbar"></i></span></div>
</aside>
<main>
  <details class="taskinfo" id="taskinfo">
    <summary>任务说明（点开看：这批样本的来历、为什么要裁、每个选项的含义）</summary>
    <div class="intro" id="intro"></div>
    <ul id="optdesc"></ul>
  </details>
  <div class="card" id="card"></div>
  <div class="err" id="err"></div>
</main>
<aside class="right">
  <div class="paneltitle">图片显示</div>
  <button class="viewtoggle" id="viewtoggle">📐 大图：开</button>
  <div class="sizerow">尺寸 <input type="range" id="imgsize" min="150" max="600" step="10"><span id="imgsizev">300</span>px</div>
  <div class="paneltitle">快捷键</div>
  <div class="hint" style="margin-top:0;border-top:none;padding-top:0">
    数字键 1-9 = 选对应选项并跳下一张未裁样本<br>←/→ = 前后翻页<br>Esc = 退出备注框（备注输入时数字键暂不生效，按 Esc 恢复）<br>选完立即落盘；已裁样本重选即覆盖
  </div>
</aside>
<script>
"use strict";
let tasks = {}, task = null, samples = [], verdicts = {}, idx = 0;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const imgUrl = (p) => "/img?p=" + encodeURIComponent(p);
const draftKey = (sid) => `wb-draft-${task.name}-${sid}`;
const loadDraft = (sid) => { try { return localStorage.getItem(draftKey(sid)) ?? ""; } catch { return ""; } };
let bigMode = true;
try { bigMode = localStorage.getItem("wb-bigmode") !== "0"; } catch {}
const applyToggle = () => {
  $("viewtoggle").textContent = bigMode ? "📐 大图：开" : "📐 大图：关";
};
const applyImgSize = (v) => {
  document.documentElement.style.setProperty("--imgw", v + "px");
  $("imgsizev").textContent = v;
};
{ let v = 300; try { v = parseInt(localStorage.getItem("wb-imgsize")) || 300; } catch {}
  document.addEventListener("DOMContentLoaded", () => {
    $("imgsize").value = v; applyImgSize(v);
    $("imgsize").addEventListener("input", (e) => {
      applyImgSize(e.target.value);
      try { localStorage.setItem("wb-imgsize", e.target.value); } catch {}
    });
  });
}

async function load() {
  tasks = await (await fetch("/api/tasks")).json();
  verdicts = await (await fetch("/api/progress")).json();
  const names = Object.keys(tasks);
  $("tabs").innerHTML = names.map(n => {
    const t = tasks[n];
    const label = `${t.title || n}（${t.n_samples} 张）`;
    return `<button data-n="${esc(n)}" title="${esc(n)}">${esc(label)}</button>`;
  }).join("");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.onclick = () => switchTask(b.dataset.n));
  $("viewtoggle").onclick = () => {
    bigMode = !bigMode;
    try { localStorage.setItem("wb-bigmode", bigMode ? "1" : "0"); } catch {}
    applyToggle(); render();
  };
  applyToggle();
  if (names.length) switchTask(names[0]);
}

async function switchTask(name) {
  task = await (await fetch("/api/task?name=" + encodeURIComponent(name))).json();
  samples = task.samples; idx = 0;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.n === name));
  $("intro").innerHTML = esc(task.intro || "（任务包未提供说明）").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  $("optdesc").innerHTML = (task.options || []).map(o =>
    `<li><b>${esc(o.label || o.key)}</b>：${esc(o.desc || "（未提供描述）")}</li>`).join("");
  $("taskinfo").open = false;  // 默认折叠，点开细读
  render();
}

function done(sid) { return verdicts[task.name] && (sid in verdicts[task.name]); }
function lastOf(sid) { return (verdicts[task.name] || {})[sid] || null; }

function render() {
  const total = samples.length, ndone = samples.filter(s => done(s.id)).length;
  $("ptext").textContent = `已完成 ${ndone}/${total}`;
  $("pbar").style.width = total ? (ndone / total * 100) + "%" : 0;
  if (idx >= total) {
    $("card").innerHTML = `<div class="done">本任务已到末尾（${ndone}/${total} 张已裁）<br><br>
      <button onclick="idx=0;render()">回到开头</button></div>`;
    return;
  }
  const s = samples[idx];
  const last = lastOf(s.id);
  const draft = loadDraft(s.id);
  const shownNote = draft !== "" ? draft : (last ? last.note : "");
  const lastLabel = last ? ((task.options.find(o => o.key === last.choice) || {}).label || last.choice) : "";
  // meta 压缩显示：剔除 src；短值并一行（｜分隔），长值（理由等）单独行；same/diff 彩色符号
  const sym = (v) => v === "same" ? '<span class="ok">✓</span>'
    : v === "diff" ? '<span class="bad">✗</span>'
    : v === "unsure" ? '<span class="q">?</span>'
    : esc(String(v).replace(/^VERDICT=\w+，?\s*/, ""));  // 剥机器判定前缀（结论已在符号行）
  const entries = Object.entries(s.meta || {}).filter(([k]) => k !== "src");
  const shorts = [], longs = [];
  for (const [k, v] of entries) (String(v).length <= 14 ? shorts : longs).push(`${esc(k)}: ${sym(v)}`);
  const meta = [
    ...(shorts.length ? [shorts.join(" ｜ ")] : []),
    ...longs,
  ].join("\n") || "（无附加信息）";
  const imgs = s.images.map((p, i) =>
    `<figure><img src="${imgUrl(p)}" loading="lazy"><figcaption>${esc(s.captions ? s.captions[i] : p.split("/").pop())}</figcaption></figure>`).join("");
  const opts = task.options.map((o, i) =>
    `<button data-k="${esc(o.key)}" class="${last && last.choice === o.key ? "picked" : ""}"><span class="k"><b>${i + 1}</b>${esc(o.label || o.key)}</span>${o.desc ? `<span class="d">${esc(o.desc)}</span>` : ""}</button>`).join("");
  $("card").innerHTML = `
    <div class="imgs${bigMode ? " big" : ""}">${imgs}</div>
    <div class="meta">样本号 ${esc(s.id)}${last ? ` ｜ ✅ 已裁：上次选「${esc(lastLabel)}」（重选即覆盖）` : ""}\n${meta}</div>
    <div class="dock">
      <div class="opts">${opts}</div>
      <div class="nav">
        <button onclick="idx=Math.max(0,idx-1);render()">← 上一张</button>
        <span class="pos">第 ${idx + 1} / ${total} 张</span>
        <input class="note" id="note" value="${esc(shownNote)}" placeholder="备注（选选项时随裁决一起落盘）">
        <button onclick="idx=Math.min(samples.length-1,idx+1);render()">下一张 →</button>
      </div>
    </div>`;
  const noteEl = $("note");
  noteEl.addEventListener("input", () => {
    try { localStorage.setItem(draftKey(s.id), noteEl.value); } catch {}
  });
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => pick(b.dataset.k));
}

async function pick(key) {
  const s = samples[idx];
  const note = ($("note") && $("note").value.trim()) || "";
  try {
    const r = await fetch("/api/verdict", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task: task.name, sample_id: s.id, choice: key, note})});
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    verdicts[task.name] = verdicts[task.name] || {};
    verdicts[task.name][s.id] = {choice: key, note};
    try { localStorage.removeItem(draftKey(s.id)); } catch {}
    $("err").textContent = "";
    const next = samples.findIndex((x, i) => i > idx && !done(x.id));
    idx = next >= 0 ? next : idx + 1;
    render();
  } catch (e) { $("err").textContent = "保存失败: " + e.message; }
}

document.addEventListener("keydown", (e) => {
  if (!task) return;
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();  // Esc 退出备注框，恢复数字快捷键
    return;
  }
  if (e.target.tagName === "SUMMARY") return;
  if (e.key === "ArrowLeft") { idx = Math.max(0, idx - 1); render(); }
  else if (e.key === "ArrowRight") { idx = Math.min(samples.length - 1, idx + 1); render(); }
  else if (/^[1-9]$/.test(e.key)) {
    const o = task.options[Number(e.key) - 1];
    if (o) pick(o.key);
  }
});

load();
</script>
</body>
</html>
