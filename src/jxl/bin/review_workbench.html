<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Noto Sans CJK SC", sans-serif; background: #f4f5f7; color: #222; display: flex; min-height: 100vh; }
  aside { width: 240px; flex: 0 0 240px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
          background: #fff; border-right: 1px solid #ddd; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  aside.right { border-right: none; border-left: 1px solid #ddd; width: 220px; flex: 0 0 220px; }
  aside h1 { font-size: 16px; font-weight: 600; }
  #roundsel { padding: 8px 10px; border: 1px solid #bbb; border-radius: 6px; font-size: 13px;
              background: #fff; color: #222; cursor: pointer; width: 100%; }
  .paneltitle { font-size: 12px; font-weight: 600; color: #888; letter-spacing: .05em; margin: 4px 0 -2px; }
  .navsep { border-top: 1px solid #e5e7eb; margin: 10px 0 2px; }
  .tabs { display: flex; flex-direction: column; gap: 6px; }
  .tabs button { padding: 8px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer;
                 font-size: 13px; text-align: left; line-height: 1.4; }
  .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .viewtoggle { padding: 8px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .progress { font-size: 13px; color: #555; }
  .bar { width: 100%; height: 8px; background: #e2e4e9; border-radius: 4px; overflow: hidden; display: block; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: #22c55e; }
  .sizerow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; }
  .sizerow input[type=range] { flex: 1; }
  .hint { font-size: 11.5px; color: #888; line-height: 1.7; margin-top: auto; border-top: 1px solid #eee; padding-top: 10px; }
  @media (max-width: 1100px) { aside.right { display: none; } }
  main { flex: 1; min-width: 0; margin: 14px auto; padding: 0 16px; max-width: 1200px; }
  .taskinfo { background: #eef4ff; border: 1px solid #c7d7f5; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .taskinfo summary { cursor: pointer; font-weight: 600; color: #1d4ed8; font-size: 13px; }
  .taskinfo .intro { white-space: pre-wrap; line-height: 1.8; color: #333; margin-top: 8px; }
  .taskinfo .intro b { color: #1d4ed8; }
  .taskinfo ul { margin: 8px 0 0 0; padding-left: 20px; line-height: 1.8; color: #444; }
  .taskinfo .paths { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #c7d7f5;
                     font-family: ui-monospace, monospace; font-size: 11px; color: #667; line-height: 1.8; word-break: break-all; }
  .taskinfo .paths span { color: #99a; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
  .imgs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .imgs figure { text-align: center; }
  .imgs img { max-width: 46%; max-height: 420px; border: 1px solid #ccc; border-radius: 6px; }
  .imgs figcaption { font-size: 12px; color: #777; margin-top: 4px; }
  /* 大图模式：左右并排，每张宽度 --imgw（右栏滑杆可调，默认 300px），中缝约 100px */
  .imgs.big { display: flex; justify-content: center; align-items: flex-start; column-gap: clamp(60px, 7vw, 110px); row-gap: 12px; flex-wrap: wrap; }
  .imgs.big figure { flex: 0 0 min(var(--imgw, 300px), 30vw); }
  .imgs.big img { width: 100%; max-width: 100%; max-height: none; height: auto; }
  .meta { font-size: 13px; color: #555; line-height: 1.7; background: #f8f9fb; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; white-space: pre-wrap; }
  .opts { margin-top: 12px; }
  .meta .ok { color: #16a34a; font-weight: 800; font-size: 16px; }
  .meta .bad { color: #dc2626; font-weight: 800; font-size: 16px; }
  .meta .q { color: #6b7280; font-weight: 800; font-size: 16px; }
  .dock { position: sticky; top: 0; z-index: 5; background: #fff; border: 1px solid #ddd;
           border-radius: 10px; padding: 10px 14px 8px; margin-bottom: 12px; }
  .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .opts button { padding: 8px 14px; font-size: 14px; border: 1px solid #bbb; border-left-width: 5px; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; }
  .opts button .k { display: block; }
  .opts button .k b { margin-right: 6px; }
  .opts button .d { display: block; font-size: 11.5px; color: #777; margin-top: 3px; max-width: 300px; line-height: 1.45; }
  /* 语义配色标准：ok 正向判定=绿 ｜ no 负向=红 ｜ mid 不可判定=灰（黑白难分） ｜ meta 元操作=蓝 ｜ out 域外剔除=紫 */
  .opts button[data-tone=ok]  { border-color: #16a34a; background: #f0fdf4; } .opts button[data-tone=ok] .k,  .opts button[data-tone=ok] .k b  { color: #15803d; }
  .opts button[data-tone=no]  { border-color: #dc2626; background: #fef2f2; } .opts button[data-tone=no] .k,  .opts button[data-tone=no] .k b  { color: #b91c1c; }
  .opts button[data-tone=mid] { border-color: #6b7280; background: #f4f4f5; } .opts button[data-tone=mid] .k, .opts button[data-tone=mid] .k b { color: #4b5563; }
  .opts button[data-tone=meta]{ border-color: #2563eb; background: #eff6ff; } .opts button[data-tone=meta] .k,.opts button[data-tone=meta] .k b{ color: #1d4ed8; }
  .opts button[data-tone=out] { border-color: #7c3aed; background: #f5f3ff; } .opts button[data-tone=out] .k, .opts button[data-tone=out] .k b { color: #6d28d9; }
  .opts button.picked { background: var(--tone, #16a34a); color: #fff; border-color: var(--tone, #16a34a); }
  .opts button.picked .k, .opts button.picked .k b, .opts button.picked .d { color: #fff; }
  .nav { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .nav button { padding: 8px 14px; font-size: 14px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .nav .pos { font-size: 14px; font-weight: 600; color: #1d4ed8; white-space: nowrap; }
  .noterow { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .noterow .notelabel { font-size: 13px; font-weight: 600; color: #555; white-space: nowrap; }
  .noterow .note { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; }
  /* 顶部过滤器栏（电商式）与底部导航栏 */
  .filterbar { position: sticky; top: 0; z-index: 5; background: #fff; border: 1px solid #ddd;
               border-radius: 10px; padding: 8px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .filterbar .flabel { font-size: 13px; font-weight: 700; color: #374151; white-space: nowrap; }
  .badges { display: flex; gap: 5px; font-size: 12px; white-space: nowrap; align-items: center; flex-wrap: wrap; }
  .badges b { padding: 3px 10px; border-radius: 12px; cursor: pointer; font-weight: 600; border: 1px solid transparent; }
  .badges b.on { border-color: currentColor; box-shadow: inset 0 0 0 1.5px currentColor; }
  .dock { position: sticky; bottom: 0; z-index: 5; background: #fff; border: 1px solid #ddd;
          border-radius: 10px; padding: 8px 14px; margin-top: 12px; display: flex; align-items: center; gap: 12px; justify-content: center; }
  .dock .pos { font-size: 14px; font-weight: 600; color: #1d4ed8; white-space: nowrap; }
  .dock .navhint { font-size: 11.5px; color: #999; white-space: nowrap; }
  .dock button { padding: 8px 16px; font-size: 14px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .done { text-align: center; padding: 60px 0; color: #16a34a; font-size: 18px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<aside class="left">
  <h1>{{TITLE}}</h1>
  <div class="paneltitle">◈ 轮次</div>
  <select id="roundsel"></select>
  <div class="navsep"></div>
  <div class="paneltitle">◈ 任务</div>
  <div class="tabs" id="tabs"></div>
  <div class="progress"><span id="ptext"></span><span class="bar"><i id="pbar"></i></span></div>
</aside>
<main>
  <div class="filterbar">
    <span class="flabel">过滤器:</span>
    <div class="badges" id="badges"></div>
  </div>
  <div class="card" id="card"></div>
  <div class="err" id="err"></div>
  <div class="dock">
    <span class="pos" id="pos"></span>
    <button id="prevbtn">← 上一张 (A)</button>
    <button id="nextbtn">下一张 (D) →</button>
    <span class="navhint">W/S = 上下滚动屏幕</span>
  </div>
  <details class="taskinfo" id="taskinfo">
    <summary>任务说明（点开看：这批样本的来历、为什么要裁、每个选项的含义、数据位置）</summary>
    <div class="intro" id="intro"></div>
    <ul id="optdesc"></ul>
    <div class="paths" id="datapaths"></div>
  </details>
</main>
<aside class="right">
  <div class="paneltitle">图片显示</div>
  <button class="viewtoggle" id="viewtoggle">📐 大图：开</button>
  <div class="sizerow">尺寸 <input type="range" id="imgsize" min="150" max="600" step="10"><span id="imgsizev">300</span>px</div>
  <div class="paneltitle">快捷键</div>
  <div class="hint" style="margin-top:0;border-top:none;padding-top:0">
    A / D = 上一张 / 下一张<br>W / S = 向上 / 向下滚动屏幕<br>数字键 1-9 = 选对应选项并跳下一张未裁样本<br>X = 取消标注（清除本张裁决）<br>Esc = 退出备注框（备注输入时快捷键暂不生效，按 Esc 恢复）<br>选完立即落盘；已裁样本重选即覆盖
  </div>
</aside>
<script>
"use strict";
const UNDONE = "__undone";  // 「未标注」过滤器
let tasks = {}, task = null, samples = [], verdicts = {}, idx = 0, curRound = null, filter = null;
const viewIdxs = () => samples.map((s, i) => i)
  .filter(i => filter === UNDONE ? !done(samples[i].id)
           : filter ? ((lastOf(samples[i].id) || {}).choice === filter)
           : true);
function gotoPrev() { const v = viewIdxs(); idx = (v.filter(i => i < idx).pop() ?? v[v.length - 1] ?? idx); render(); }
function gotoNext() { const v = viewIdxs(); idx = (v.find(i => i > idx) ?? v[0] ?? idx); render(); }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const imgUrl = (p) => "/img?p=" + encodeURIComponent(p);
const draftKey = (sid) => `wb-draft-${task.name}-${sid}`;
const loadDraft = (sid) => { try { return localStorage.getItem(draftKey(sid)) ?? ""; } catch { return ""; } };
let bigMode = true;
try { bigMode = localStorage.getItem("wb-bigmode") !== "0"; } catch {}
const applyToggle = () => {
  $("viewtoggle").textContent = bigMode ? "📐 大图：开" : "📐 大图：关";
};
const applyImgSize = (v) => {
  document.documentElement.style.setProperty("--imgw", v + "px");
  $("imgsizev").textContent = v;
};
{ let v = 300; try { v = parseInt(localStorage.getItem("wb-imgsize")) || 300; } catch {}
  document.addEventListener("DOMContentLoaded", () => {
    $("imgsize").value = v; applyImgSize(v);
    $("imgsize").addEventListener("input", (e) => {
      applyImgSize(e.target.value);
      try { localStorage.setItem("wb-imgsize", e.target.value); } catch {}
    });
  });
}

async function load() {
  const rounds = await (await fetch("/api/rounds")).json();
  $("roundsel").innerHTML = rounds.map(r =>
    `<option value="${esc(r.dir)}">第 ${r.no} 轮 · ${esc(r.date)}${r.note ? " · " + esc(r.note) : ""}（${r.n_samples} 张）</option>`).join("");
  $("roundsel").onchange = () => loadRound($("roundsel").value);
  $("viewtoggle").onclick = () => {
    bigMode = !bigMode;
    try { localStorage.setItem("wb-bigmode", bigMode ? "1" : "0"); } catch {}
    applyToggle(); render();
  };
  applyToggle();
  $("prevbtn").onclick = gotoPrev;
  $("nextbtn").onclick = gotoNext;
  if (rounds.length) loadRound(rounds[rounds.length - 1].dir);  // 默认最新轮
}

async function loadRound(dir) {
  curRound = dir;
  const q = "round=" + encodeURIComponent(dir);
  tasks = await (await fetch("/api/tasks?" + q)).json();
  verdicts = await (await fetch("/api/progress?" + q)).json();
  const names = Object.keys(tasks);
  $("tabs").innerHTML = names.map(n => {
    const t = tasks[n];
    const label = `${t.title || n}（${t.n_samples} 张）`;
    return `<button data-n="${esc(n)}" title="${esc(n)}">${esc(label)}</button>`;
  }).join("");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.onclick = () => switchTask(b.dataset.n));
  if (names.length) switchTask(names[0]); else render();
}

async function switchTask(name) {
  task = await (await fetch(`/api/task?round=${encodeURIComponent(curRound)}&name=${encodeURIComponent(name)}`)).json();
  samples = task.samples; idx = 0; filter = null;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.n === name));
  $("intro").innerHTML = esc(task.intro || "（任务包未提供说明）").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  $("optdesc").innerHTML = (task.options || []).map(o =>
    `<li><b>${esc(o.label || o.key)}</b>：${esc(o.desc || "（未提供描述）")}</li>`).join("");
  const p = task._paths || {};
  $("datapaths").innerHTML = p.task
    ? `<span>任务包：</span>${esc(p.task)}<br><span>裁决结果（你的标注落盘）：</span>${esc(p.results)}`
    : "";
  $("taskinfo").open = false;  // 默认折叠，点开细读
  render();
}

function done(sid) { return verdicts[task.name] && (sid in verdicts[task.name]); }
function lastOf(sid) { return (verdicts[task.name] || {})[sid] || null; }

function render() {
  const total = samples.length, ndone = samples.filter(s => done(s.id)).length;
  $("ptext").textContent = `已完成 ${ndone}/${total}`;
  $("pbar").style.width = total ? (ndone / total * 100) + "%" : 0;

  // 顶部过滤器（全部=默认 ｜ 未标注 ｜ 各选项）——过滤态下翻页与自动跳转只在集内移动
  const toneOf = {};
  (task.options || []).forEach(o => toneOf[o.key] = o.tone || "meta");
  const counts = {};
  samples.forEach(x => { const v = lastOf(x.id); if (v) counts[v.choice] = (counts[v.choice] || 0) + 1; });
  const BADGE_C = {ok: "#15803d", no: "#b91c1c", mid: "#4b5563", meta: "#1d4ed8", out: "#6d28d9"};
  const BADGE_BG = {ok: "#f0fdf4", no: "#fef2f2", mid: "#f4f4f5", meta: "#eff6ff", out: "#f5f3ff"};
  $("badges").innerHTML =
    `<b data-k="" class="${!filter ? "on" : ""}" style="background:#e5e7eb;color:#374151">全部 ${total}</b>` +
    `<b data-k="${UNDONE}" class="${filter === UNDONE ? "on" : ""}" style="background:#f8f9fb;color:#555">未标注 ${total - ndone}</b>` +
    (task.options || []).map(o =>
      `<b data-k="${esc(o.key)}" class="${filter === o.key ? "on" : ""}" style="background:${BADGE_BG[o.tone || "meta"]};color:${BADGE_C[o.tone || "meta"]}">${esc(o.label || o.key)} ${counts[o.key] || 0}</b>`).join("");
  document.querySelectorAll("#badges b").forEach(el =>
    el.onclick = () => {
      filter = el.dataset.k === "" ? null : el.dataset.k;  // 「全部」=无过滤
      const v = viewIdxs();
      idx = v.length ? v[0] : 0;
      render();
    });
  $("pos").textContent = `第 ${Math.min(idx + 1, total)} / ${total} 张`;

  if (idx >= total) {
    $("card").innerHTML = `<div class="done">本任务已到末尾（${ndone}/${total} 张已裁）<br><br>
      <button onclick="idx=0;render()">回到开头</button></div>`;
    return;
  }
  const s = samples[idx];
  const last = lastOf(s.id);
  const draft = loadDraft(s.id);
  const lastLabel = last ? ((task.options.find(o => o.key === last.choice) || {}).label || last.choice) : "";
  // meta 压缩显示：剔除 src；短值并一行（｜分隔），长值（理由等）单独行；same/diff 彩色符号
  const sym = (v) => v === "same" ? '<span class="ok">✓</span>'
    : v === "diff" ? '<span class="bad">✗</span>'
    : v === "unsure" ? '<span class="q">?</span>'
    : esc(String(v).replace(/^VERDICT=\w+，?\s*/, ""));  // 剥机器判定前缀（结论已在符号行）
  const entries = Object.entries(s.meta || {}).filter(([k]) => k !== "src");
  const shorts = [], longs = [];
  for (const [k, v] of entries) (String(v).length <= 14 ? shorts : longs).push(`${esc(k)}: ${sym(v)}`);
  const meta = [
    ...(shorts.length ? [shorts.join(" ｜ ")] : []),
    ...longs,
  ].join("\n") || "（无附加信息）";
  const imgs = s.images.map((p, i) =>
    `<figure><img src="${imgUrl(p)}" loading="lazy"><figcaption>${esc(s.captions ? s.captions[i] : p.split("/").pop())}</figcaption></figure>`).join("");
  const TONE_BG = {ok: "#16a34a", no: "#dc2626", mid: "#6b7280", meta: "#2563eb", out: "#7c3aed"};
  const optsHtml = task.options.map((o, i) => {
    const picked = last && last.choice === o.key;
    return `<button data-k="${esc(o.key)}" data-tone="${esc(o.tone || "meta")}"${picked ? ` class="picked" style="--tone:${TONE_BG[o.tone || "meta"]}"` : ""}><span class="k"><b>${i + 1}</b>${esc(o.label || o.key)}</span>${o.desc ? `<span class="d">${esc(o.desc)}</span>` : ""}</button>`;
  }).join("")
    + `<button data-k="__clear__" data-tone="mid"><span class="k"><b>X</b>取消标注</span><span class="d">清除本张的裁决，恢复未标注状态</span></button>`;
  $("card").innerHTML = `
    <div class="imgs${bigMode ? " big" : ""}">${imgs}</div>
    <div class="meta">样本号 ${esc(s.id)}${last ? ` ｜ ✅ 已裁：上次选「${esc(lastLabel)}」（重选即覆盖）` : ""}\n${meta}</div>
    <div class="opts">${optsHtml}</div>
    <div class="noterow"><span class="notelabel">备注:</span><input class="note" id="note" value="${esc(draft !== "" ? draft : (last ? last.note : ""))}" placeholder="选选项时随裁决一起落盘"></div>`;
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => pick(b.dataset.k));
  $("note").addEventListener("input", () => {
    try { localStorage.setItem(draftKey(s.id), $("note").value); } catch {}
  });
}

async function pick(key) {
  const s = samples[idx];
  const note = ($("note") && $("note").value.trim()) || "";
  try {
    const r = await fetch("/api/verdict", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({round: curRound, task: task.name, sample_id: s.id, choice: key, note})});
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    verdicts[task.name] = verdicts[task.name] || {};
    if (key === "__clear__") delete verdicts[task.name][s.id];
    else verdicts[task.name][s.id] = {choice: key, note};
    try { localStorage.removeItem(draftKey(s.id)); } catch {}
    $("err").textContent = "";
    if (filter) { gotoNext(); return; }  // 过滤态：集内下一张
    const next = samples.findIndex((x, i) => i > idx && !done(x.id));
    idx = next >= 0 ? next : idx + 1;
    render();
  } catch (e) { $("err").textContent = "保存失败: " + e.message; }
}

document.addEventListener("keydown", (e) => {
  if (!task) return;
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") e.target.blur();  // Esc 退出备注框，恢复数字快捷键
    return;
  }
  if (e.target.tagName === "SUMMARY") return;
  const k = e.key.toLowerCase();
  if (k === "a" || e.key === "ArrowLeft") gotoPrev();
  else if (k === "d" || e.key === "ArrowRight") gotoNext();
  else if (k === "w") window.scrollBy({top: -Math.round(innerHeight * 0.85), behavior: "smooth"});
  else if (k === "s") window.scrollBy({top: Math.round(innerHeight * 0.85), behavior: "smooth"});
  else if (k === "x") pick("__clear__");
  else if (/^[1-9]$/.test(e.key)) {
    const o = task.options[Number(e.key) - 1];
    if (o) pick(o.key);
  }
});

load();
</script>
</body>
</html>
